<!DOCTYPE html>
<html lang="en" data-default-theme="{{ default_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_title }}{% endblock %}</title>
    <script>/* FOUC prevention – apply saved theme before first paint */
    (function(){var d=document.documentElement,t=localStorage.getItem('certtools-theme')||d.getAttribute('data-default-theme')||'split';d.setAttribute('data-theme',t);})()</script>
    <script src="/static/tailwindcss.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% block head_extra %}{% endblock %}
    {% if analytics_html %}{{ analytics_html|safe }}{% endif %}
</head>
<body class="cyber-grid-bg min-h-screen flex text-slate-200">
    {% block body %}
    {% include 'sidebar.html' %}

    <main class="flex-1 p-4 md:p-8 lg:p-10 overflow-y-auto min-h-screen">
        <div class="{% block content_class %}max-w-5xl{% endblock %} page-enter">
            {% block content %}{% endblock %}
        </div>
    </main>
    {% endblock %}

    <script src="/static/theme.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
