# Default values for certificate-tools.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/gitsoep/certificate-tools
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  targetPort: 5001
  
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: certificate-tools.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: certificate-tools-tls
  #    hosts:
  #      - certificate-tools.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # Application title
  appTitle: "Certificate Tools"
  
  # External URL for OAuth callbacks (when behind reverse proxy)
  # Example: https://certificate-tools.example.com
  externalUrl: ""
  
  # Azure AD Configuration
  azure:
    # Azure Client ID for OAuth
    clientId: ""
    # Azure Tenant ID (default: common)
    tenantId: "common"
    
  # Azure Blob Storage Configuration
  blobStorage:
    # Azure Blob Storage URL
    url: ""
    # Azure Blob Storage Container name
    container: "storage"
  
  # Azure Key Vault Configuration
  keyVault:
    # Default Key Vault URL
    url: ""
  
  # CSR Generator Defaults
  csrDefaults:
    country: "NL"
    state: "Gelderland"
    locality: "Nijmegen"
    organization: "Soep Org"
    organizationalUnit: "Web Unit"
    commonName: "Soep Example"
    email: "no-reply@gitsoep.nl"
    keySize: "4096"

# Secrets configuration
# Create a secret manually or use external-secrets operator
secrets:
  # Name of existing secret containing Azure credentials
  # Should contain keys: AZURE_CLIENT_SECRET, FLASK_SECRET_KEY
  existingSecret: ""
  
  # If existingSecret is not provided, these values will be used to create a secret
  # WARNING: It's recommended to use existingSecret or external-secrets instead
  azureClientSecret: ""
  flaskSecretKey: ""
